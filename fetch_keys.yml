---
- name: Audit Authorized SSH Keys on Managed Servers
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: false

  tasks:
    - name: Audit authorized SSH keys for local users in a single pass
      ansible.builtin.shell: |
        T_USER="{{ target_user | default('all') }}"
        
        if [ "$T_USER" != "all" ] && [ "$T_USER" != "" ]; then
          USERS="$T_USER"
        else
          USERS=$( (getent -s files passwd || cat /etc/passwd) | awk -F: '$6 ~ /\/(home|root)/ {print $1}' )
        fi

        echo "$USERS" | sort -u | while read -r user; do
          [ -z "$user" ] && continue
          if [ "$user" = "root" ]; then
            keyfile="/root/.ssh/authorized_keys"
          else
            keyfile="/home/$user/.ssh/authorized_keys"
          fi
          disabled_file="${keyfile}.sshmanager_disabled"
          
          if [ -f "$keyfile" ]; then
            count=$(grep -cE '^(ssh-|ecdsa-|sk-ssh-)' "$keyfile" 2>/dev/null || echo 0)
            status="active"
            key_b64=$(cat "$keyfile" 2>/dev/null | base64 | tr -d '\n\r ')
          elif [ -f "$disabled_file" ]; then
            count=$(grep -cE '^(ssh-|ecdsa-|sk-ssh-)' "$disabled_file" 2>/dev/null || echo 0)
            status="disabled"
            key_b64=$(cat "$disabled_file" 2>/dev/null | base64 | tr -d '\n\r ')
          else
            count=0
            status="none"
            key_b64=""
          fi
          echo "SSHKEYAUDIT|host={{ inventory_hostname }}|user=${user}|keys_count=${count}|status=${status}|keys_b64=${key_b64}"
        done
      register: key_counts_raw
      changed_when: false
      failed_when: false

    - name: Print audit results
      ansible.builtin.debug:
        msg: "{{ item }}"
      loop: "{{ key_counts_raw.stdout_lines | default([]) }}"
      when: item is defined and 'SSHKEYAUDIT|' in item
